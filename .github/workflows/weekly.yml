name: Beauty Legal Weekly Report

on:
  schedule:
    # GitHub may delay or drop schedules at the top of the hour.
    # 00:17 UTC = Monday 08:17 in Asia/Shanghai.
    - cron: '17 0 * * 1'
  workflow_dispatch:
    inputs:
      allow_duplicate_debug:
        description: '调试阶段允许重复推送'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      no_delivery:
        description: '只跑正式采集和质量验收，不推送钉钉/飞书'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_BASE_URL: ${{ vars.AI_API_BASE_URL || 'https://api.deepseek.com/v1' }}
      MIN_SOURCE_COVERAGE: ${{ vars.MIN_SOURCE_COVERAGE || '0.9' }}
      MIN_CHINA_CRITICAL_COVERAGE: ${{ vars.MIN_CHINA_CRITICAL_COVERAGE || '0.9' }}
      REPORT_QUALITY_MODE: quality
      AI_MODEL: deepseek-chat
      REPORT_TARGET_ITEMS: 20
      PREMIUM_MIN_ITEMS: 20
      PREMIUM_MAX_ITEMS: 24
      PREMIUM_MIN_PER_MODULE: 2
      PREMIUM_MAX_PER_MODULE: 5
      DISCOVERY_WINDOW_DAYS: 30
      DISCOVERY_MAX_ITEMS: 160
      DISCOVERY_MAX_PER_HOST: 10
      DISCOVERY_MAX_PER_MODULE: 36
      DISCOVERY_MIN_PER_MODULE: 10
      DISCOVERY_RECOVERY_DAYS: 30
      DISCOVERY_QUERY_TIMEOUT_MS: 15000
      DISCOVERY_TOTAL_TIMEOUT_MS: 180000
      AUTHORITY_RESOLUTION_LEAD_LIMIT: 24
      AUTHORITY_RESULTS_PER_QUERY: 2
      DETAIL_CANDIDATE_LIMIT: 48
      DETAIL_FETCH_TIMEOUT_MS: 12000
      DETAIL_FETCH_CONCURRENCY: 8
      DETAIL_BROWSER_RECOVERY_LIMIT: 18
      SOURCE_HYDRATION_FILE: out/hydrated-authority.json
      CRAWL4_AI_BASE_DIRECTORY: /tmp/beauty-legal-bot-crawl4ai
      CRAWL4AI_ATTACHMENT_LIMIT: 2
      CRAWL4AI_DETAIL_LINK_LIMIT: 12
      CRAWL4AI_PREVIEW_LIMIT: 96
      CRAWL4AI_MIN_PER_MODULE: 6
      CRAWL4AI_CONCURRENCY: 6
      CRAWL4AI_REQUEST_LIMIT: 96
      FORCE_DELIVERY: '0'
      NO_DELIVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.no_delivery == 'true' && '1' || '0' }}
      DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 34ddeeabd234776dc7c0f144257ecb7c
      CLOUDFLARE_KV_NAMESPACE_ID: 3b38ee9b31b74c4faee81ee5b92b3bdb
      PUBLIC_WORKER_BASE_URL: https://beauty-legal-bot.ai-cf.workers.dev
    steps:
      - uses: actions/checkout@v5

      - name: Restore dedupe fingerprints from previous run
        run: |
          mkdir -p out
          PREV_RUN=$(gh run list --workflow weekly.yml --status completed --limit 2 --json databaseId --jq '.[1].databaseId' 2>/dev/null || echo "")
          if [ -n "$PREV_RUN" ]; then
            gh run download "$PREV_RUN" --name "pipeline-evidence-$PREV_RUN" --dir out/prev 2>/dev/null || true
            if [ -f out/prev/seen-fingerprints.json ]; then
              cp out/prev/seen-fingerprints.json out/seen-fingerprints.json
              echo "[dedupe] restored fingerprints from run $PREV_RUN"
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install crawl4ai

      - name: Install crawl browser
        run: |
          npx playwright install --with-deps chromium
          python -m playwright install chromium

      - name: Discover open-web legal events
        run: node scripts/discover-open-web.js out/discovery.json out/acquisition-manifest.json

      - name: Hydrate evidence sources
        run: |
          mkdir -p out
          node scripts/crawl4ai-hydrate.js \
            --python python \
            --input out/acquisition-manifest.json \
            --output "$SOURCE_HYDRATION_FILE" \
            --limit 96 \
            --page-timeout-ms 25000 \
            --attachment-limit "$CRAWL4AI_ATTACHMENT_LIMIT" \
            || echo '{"records":[]}' > "$SOURCE_HYDRATION_FILE"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.env.SOURCE_HYDRATION_FILE,'utf8')); const rows=(p.records||[]); console.log('hydrated records=' + rows.length + ', withText=' + rows.filter(r => (r.article_text||r.raw_markdown||r.fit_markdown||'').length > 0).length + ', attachments=' + rows.reduce((s,r)=>s+(r.attachment_urls||[]).length,0));"

      - name: Assemble report from hydrated evidence
        run: node scripts/assemble-cards.js "$SOURCE_HYDRATION_FILE" out/assembled-cards.json

      - name: Render PDF report
        run: node scripts/render-report-pdf.js out/latest-report.md

      - name: Prepare PDF for publishing
        run: |
          mkdir -p public
          DATE=$(date +%Y-%m-%d)
          cp out/latest-report.pdf "public/美妆法务资讯周报-${DATE}.pdf"
          cp out/latest-report.pdf public/latest-report.pdf

      - name: Publish PDF to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
          force_orphan: true
          keep_files: true

      - name: Deliver to DingTalk
        run: node scripts/deliver-report.js out/latest-report.md

      - name: Upload pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 7
