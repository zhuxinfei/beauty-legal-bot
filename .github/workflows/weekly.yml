name: Beauty Legal Weekly Report

on:
  schedule:
    # GitHub may delay or drop schedules at the top of the hour.
    # 00:17 UTC = Monday 08:17 in Asia/Shanghai.
    - cron: '17 0 * * 1'
  workflow_dispatch:
    inputs:
      no_delivery:
        description: '只跑正式采集和质量验收，不推送钉钉/飞书'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      hydration_ref:
        description: '预置水合产物所在的分支/ref（本机采集用）。留空则在本 runner 上现场采集'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_API_BASE_URL: ${{ vars.AI_API_BASE_URL || 'https://api.deepseek.com/v1' }}
      MIN_SOURCE_COVERAGE: ${{ vars.MIN_SOURCE_COVERAGE || '0.9' }}
      MIN_CHINA_CRITICAL_COVERAGE: ${{ vars.MIN_CHINA_CRITICAL_COVERAGE || '0.9' }}
      REPORT_QUALITY_MODE: quality
      # 质量闸门（2026-09-15 调整）：硬门槛改成**总量下限** REPORT_MIN_ITEMS（默认 8）。
      # 原先由「核心类目 < REPORT_MIN_CORE_ITEMS」硬拦，但修好模块分区
      # （discovery_module 透传进 card）后，被接受的卡几乎全部落在 core 模块
      # （实测某周「美妆动态」0 条），core 与总量重合、已无区分度。
      # REPORT_WARN_ITEMS（默认 15）是目标值，不足只告警并在报告正文标注「本期供给偏低」；
      # 不把 15 做成硬拦，是因为历史最好成绩正好 15 条、零余量，任何扰动都会变成整期断供。
      # REPORT_MIN_CORE_ITEMS 保留但只作参考告警。
      REPORT_MIN_ITEMS: ${{ vars.REPORT_MIN_ITEMS || '8' }}
      REPORT_WARN_ITEMS: ${{ vars.REPORT_WARN_ITEMS || '15' }}
      REPORT_MIN_CORE_ITEMS: ${{ vars.REPORT_MIN_CORE_ITEMS || '8' }}
      REPORT_MIN_LEGAL_ITEMS: ${{ vars.REPORT_MIN_LEGAL_ITEMS || '2' }}
      AI_MODEL: deepseek-chat
      REPORT_TARGET_ITEMS: 20
      PREMIUM_MIN_ITEMS: 20
      PREMIUM_MAX_ITEMS: 24
      PREMIUM_MIN_PER_MODULE: 2
      PREMIUM_MAX_PER_MODULE: 5
      # 60 天发现窗口：去重指纹保证已推内容不重推，窗口内未推送的官方通告
      # （抽检/处罚/新规）是主要供给；跨周去重记忆 60 天同步覆盖
      DISCOVERY_WINDOW_DAYS: 60
      DISCOVERY_MAX_ITEMS: 300
      DISCOVERY_MAX_PER_HOST: 15
      DISCOVERY_MAX_PER_MODULE: 50
      DISCOVERY_MIN_PER_MODULE: 12
      DISCOVERY_RECOVERY_DAYS: 60
      AUTHORITY_RESOLUTION_LEAD_LIMIT: 48
      DISCOVERY_QUERY_TIMEOUT_MS: 15000
      DISCOVERY_TOTAL_TIMEOUT_MS: 180000
      AUTHORITY_RESULTS_PER_QUERY: 2
      DETAIL_CANDIDATE_LIMIT: 48
      DETAIL_FETCH_TIMEOUT_MS: 12000
      DETAIL_FETCH_CONCURRENCY: 8
      DETAIL_BROWSER_RECOVERY_LIMIT: 18
      SOURCE_HYDRATION_FILE: out/hydrated-authority.json
      CRAWL4_AI_BASE_DIRECTORY: /tmp/beauty-legal-bot-crawl4ai
      CRAWL4AI_ATTACHMENT_LIMIT: 2
      CRAWL4AI_DETAIL_LINK_LIMIT: 12
      CRAWL4AI_PREVIEW_LIMIT: 96
      CRAWL4AI_MIN_PER_MODULE: 6
      CRAWL4AI_CONCURRENCY: 6
      # 总请求预算 480：seed 200 + detail/attachment 余量 280。
      # 此前 seed 96 占满预算导致官方列表页的通告链接 detail 抓取预算为 0；
      # 2026-09 批量接入省级药监局列表页后再次提高，用于扩大法规类明细页供给。
      CRAWL4AI_REQUEST_LIMIT: 480
      # 仅 worker 链路（/test 手动触发）读取；Actions 链路由 seen-cards.json 状态去重
      FORCE_DELIVERY: '0'
      NO_DELIVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.no_delivery == 'true' && '1' || '0' }}
      DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 34ddeeabd234776dc7c0f144257ecb7c
      CLOUDFLARE_KV_NAMESPACE_ID: 3b38ee9b31b74c4faee81ee5b92b3bdb
      PUBLIC_WORKER_BASE_URL: https://beauty-legal-bot.ai-cf.workers.dev
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install crawl4ai

      - name: Install crawl browser
        run: |
          npx playwright install --with-deps chromium
          python -m playwright install chromium

      - name: Discover open-web legal events
        if: inputs.hydration_ref == ''
        run: node scripts/discover-open-web.js out/discovery.json out/acquisition-manifest.json

      - name: Hydrate evidence sources
        if: inputs.hydration_ref == ''
        run: |
          mkdir -p out
          node scripts/crawl4ai-hydrate.js \
            --python python \
            --input out/acquisition-manifest.json \
            --output "$SOURCE_HYDRATION_FILE" \
            --limit 200 \
            --page-timeout-ms 25000 \
            --attachment-limit "$CRAWL4AI_ATTACHMENT_LIMIT" \
            || echo '{"records":[]}' > "$SOURCE_HYDRATION_FILE"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.env.SOURCE_HYDRATION_FILE,'utf8')); const rows=(p.records||[]); console.log('hydrated records=' + rows.length + ', withText=' + rows.filter(r => (r.article_text||r.raw_markdown||r.fit_markdown||'').length > 0).length + ', attachments=' + rows.reduce((s,r)=>s+(r.attachment_urls||[]).length,0));"

      # 本机采集模式（2026-09-10 起）：discovery + hydration 在国内网络完成，
      # 产物以单文件分支形式推上来，CI 只负责组装/质检/发布。
      # 动机：GitHub runner 是境外 IP，政务站 WAF 全量拦截——实测 nmpa.gov.cn 14/14、
      # customs.gov.cn 6/7 返回空正文，本轮因此丢掉 15 条 hard_fact_ready。
      # 同批 URL 在本机（国内住宅 IP）探测 21/30 可抓，8 个种子源可展开为 41 条记录。
      - name: Fetch pre-hydrated evidence from local run
        if: inputs.hydration_ref != ''
        run: |
          mkdir -p out
          git fetch --depth=1 origin "${{ inputs.hydration_ref }}"
          git show FETCH_HEAD:hydrated-authority.json > "$SOURCE_HYDRATION_FILE"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.env.SOURCE_HYDRATION_FILE,'utf8')); const rows=(p.records||[]); console.log('pre-hydrated records=' + rows.length + ', withText=' + rows.filter(r => (r.article_text||'').length > 100).length);"

      # EU Safety Gate 化妆品召回（2026-09-11 新增）：官方、每周五发布、结构化 XML、
      # 无反爬无需 key。加它的动因是筛选层修对之后，瓶颈变成「合格的条目数」本身——
      # 国内法规类不是周更（实测中国政府网政策文件库返回的全是 2025 年文件），
      # 而 Safety Gate 实测最新一期发布日就是当天，41 条通报里 4 条化妆品。
      # 采集失败不阻断整期：这条通道是补充，不是主供给。
      - name: Collect EU Safety Gate cosmetics alerts
        run: |
          node scripts/collect-safety-gate.js --days 15 --merge-into "$SOURCE_HYDRATION_FILE" \
            || echo "Safety Gate 采集失败，跳过（不阻断本期）"

      - name: Assemble report from hydrated evidence
        run: |
          echo "[dedup] CWD=$(pwd)"
          echo "[dedup] fingerprint file exists: $([ -f docs/quality/seen-cards.json ] && echo YES || echo NO)"
          node scripts/assemble-cards.js "$SOURCE_HYDRATION_FILE" out/assembled-cards.json

      - name: Validate report quality gate
        run: node scripts/quality-gate.js --ci out/assembled-cards.json

      - name: Render PDF report
        run: node scripts/render-report-pdf.js out/latest-report.md

      - name: Prepare PDF for publishing
        run: |
          mkdir -p public
          DATE=$(date +%Y-%m-%d)
          cp out/latest-report.pdf "public/美妆法务资讯周报-${DATE}.pdf"
          cp out/latest-report.pdf public/latest-report.pdf

      - name: Build archive index
        run: |
          git fetch --depth=1 origin gh-pages 2>/dev/null || true
          cp -n docs/archive/*.pdf public/ 2>/dev/null || true
          node scripts/render-archive-index.js --date "$(date +%Y-%m-%d)" --out public/index.html

      # 追加式归档：每次发布会把 public/ 同步进 gh-pages，历史 PDF 保留在分支上。
      # keep_files 仅在非 orphan 模式生效，移除 force_orphan 才能保留历史 PDF
      # （force_orphan 会重建为单提交分支，旧日期 PDF 被删导致历史链接 404）。
      - name: Publish PDF to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
          keep_files: true

      - name: Deliver to DingTalk
        # deliver-report.js 仅在推送成功后把本轮 URL 写入 seen-cards.json，
        # 因此指纹提交必须排在投递之后（投递失败则文件不变，不污染去重状态）。
        run: node scripts/deliver-report.js out/latest-report.md

      - name: Commit cross-week dedup fingerprints
        run: |
          if [ -f docs/quality/seen-cards.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/quality/seen-cards.json
            git commit -m "update dedup fingerprints $(date +%Y-%m-%d)" || echo "no changes"
            git push origin HEAD || echo "push skipped"
          fi

      - name: Upload pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 7
